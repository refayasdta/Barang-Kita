<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BarangKita</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input[type="email"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        p { text-align: center; margin-top: 15px; font-size: 14px; }
        .error { color: red; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Login to BarangKita</h2>
    <p id="errorMsg" class="error"></p>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="/register">Register here</a></p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        })
        .then(async response => {
            if (response.ok) {
                const data = await response.json();
                
                // WE GOT THE TOKEN! Save it to the browser's local storage
                localStorage.setItem('jwtToken', data.token);
                localStorage.setItem('userRole', data.role);
                
                // For now, just alert success. Next step will be redirecting to the storefront!
                alert("Login Successful! Token saved. Role: " + data.role);
            } else {
                const msg = await response.text();
                document.getElementById('errorMsg').innerText = msg;
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    });
</script>
</body>
</html>
