<!DOCTYPE html>
<html lang="id">
<head>
    <script src="/js/auth-interceptor.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pesanan - BarangKita</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #EDE8D5;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* --- Navbar --- */
        .navbar {
            background: #ffffff;
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }

        .back-btn {
            position: absolute;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            color: #444;
            cursor: pointer;
            transition: color 0.2s;
        }

        .back-btn:hover { color: #1A5FCC; }
        .nav-title { font-size: 18px; font-weight: 700; color: #1A5FCC; }

        .content { padding: 32px 40px; max-width: 800px; margin: 0 auto; }

        /* --- List View Cards --- */
        .order-list { display: flex; flex-direction: column; gap: 16px; }

        .order-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .order-card:hover { 
            box-shadow: 0 6px 20px rgba(0,0,0,0.09); 
            transform: translateY(-2px);
        }

        .card-left { display: flex; align-items: center; gap: 20px; flex: 1; }
        .card-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; height: 50px; }

        .item-icon {
            width: 60px;
            height: 60px;
            background: #F4F4F6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .item-info { display: flex; flex-direction: column; gap: 4px; }
        .item-title { font-size: 15px; font-weight: 600; color: #1a1a1a; }
        .item-seller { font-size: 12px; color: #888; font-weight: 500; }
        .item-price { font-size: 14px; font-weight: 700; color: #1A5FCC; margin-top: 4px; }

        .status-badge {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Status Colors mapping */
        .status-selesai { background-color: #E8F8F0; color: #27ae60; }
        .status-dibatalkan { background-color: #FDEDEC; color: #e74c3c; }
        .status-menunggu { background-color: #FEF9E7; color: #F39C12; }
        
        .order-date { font-size: 11px; color: #aaa; font-weight: 500; display: flex; align-items: center; gap: 12px; }
        .arrow-icon { color: #ccc; font-weight: bold; font-size: 14px; }

        /* --- Detail View Elements --- */
        #detailView { display: none; }

        .detail-section {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .detail-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .detail-order-id { font-size: 14px; font-weight: 600; color: #555; }
        .detail-date { font-size: 13px; color: #888; }

        .section-title { font-size: 12px; font-weight: 700; color: #888; margin-bottom: 16px; letter-spacing: 0.5px; }

        /* Product section inside Detail */
        .detail-product { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
        .detail-product-info { flex: 1; }
        .detail-product-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .detail-qty { font-size: 13px; color: #666; }
        .detail-total { font-size: 15px; font-weight: 700; color: #1A5FCC; }

        /* Shipping & Address section */
        .shipping-row { display: flex; gap: 16px; margin-bottom: 16px; }
        .shipping-row:last-child { margin-bottom: 0; }
        .shipping-icon { width: 32px; height: 32px; background: #F4F4F6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #1A5FCC; flex-shrink: 0; }
        .shipping-text-col { display: flex; flex-direction: column; }
        .shipping-label { font-size: 11px; color: #aaa; font-weight: 500; }
        .shipping-val { font-size: 13px; font-weight: 500; color: #333; margin-top: 2px; }

        /* Price breakdown */
        .price-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; color: #555; }
        .price-row.total { border-top: 1px dashed #eee; padding-top: 12px; margin-top: 4px; font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 0; }

        .empty-state { text-align: center; padding: 60px; color: #aaa; font-size: 15px; font-weight: 600; background: white; border-radius: 16px; }
        
        .spinner { width: 36px; height: 36px; border: 3px solid #e0dbd0; border-top-color: #1A5FCC; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

<nav class="navbar">
    <button class="back-btn" id="btnBack" onclick="goBack()">← Kembali</button>
    <span class="nav-title" id="navTitle">Riwayat Pesanan</span>
</nav>

<div class="content">
    <div id="listView">
        <div class="order-list" id="ordersContainer">
            <div class="empty-state">
                <div class="spinner"></div>
                <div style="margin-top:12px;">Memuat riwayat pesanan...</div>
            </div>
        </div>
    </div>

    <div id="detailView">
        </div>
</div>

<script>
    // --- 1. Authentication & Setup ---
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    let ordersData = [];
    let userProfile = {};

    // Decode JWT to get id_akun (added in Phase 5)
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) { return null; }
    }

    const payload = parseJwt(token);
    const userId = payload ? payload.id_akun : null;

    if (!userId) {
        alert("Sesi tidak valid, silakan login ulang.");
        window.location.href = '/login';
    }

    // --- 2. Helper Functions ---
    function formatRupiah(amount) {
        return 'Rp ' + Number(amount).toLocaleString('id-ID');
    }

    function formatIndoDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    // Maps Admin English Status to UI Indonesian Badge
    function getStatusData(status) {
        if (!status) status = 'PENDING';
        if (status === 'CONFIRMED') return { text: 'Selesai', cssClass: 'status-selesai' };
        if (status === 'CANCELLED') return { text: 'Dibatalkan', cssClass: 'status-dibatalkan' };
        return { text: 'Menunggu', cssClass: 'status-menunggu' }; // PENDING
    }

    // Attempt to guess icon based on name (simulating the UI images)
    function guessIcon(itemName) {
        const name = (itemName || '').toLowerCase();
        if (name.includes('headphone') || name.includes('audio')) return '🎧';
        if (name.includes('tas') || name.includes('bag')) return '🎒';
        if (name.includes('kamera') || name.includes('camera')) return '📷';
        if (name.includes('mouse')) return '🖱️';
        if (name.includes('laptop') || name.includes('pc')) return '💻';
        return '📱'; // Default smartphone fallback
    }

    function getOngkosKirim() {
        return 25000; // Mocked flat shipping fee based on UI screenshot
    }

    // --- 3. View Management ---
    function goBack() {
        const detailView = document.getElementById('detailView');
        if (detailView.style.display === 'block') {
            // We are in detail view, go back to list
            detailView.style.display = 'none';
            document.getElementById('listView').style.display = 'block';
            document.getElementById('navTitle').textContent = 'Riwayat Pesanan';
            document.getElementById('btnBack').onclick = () => window.location.href = '/profile';
        } else {
            // We are in list view, go back to profile
            window.location.href = '/profile';
        }
    }

    // --- 4. Fetch & Render Logic ---
    async function initPage() {
        // Overwrite default back button to return to profile
        document.getElementById('btnBack').onclick = () => window.location.href = '/profile';

        try {
            // Fetch User Details for Shipping Address
            const userRes = await fetch(`/api/users/${userId}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (userRes.ok) userProfile = await userRes.json();

            // Fetch Orders
            const ordersRes = await fetch(`/api/orders/user/${userId}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            if (!ordersRes.ok) throw new Error('Failed to fetch');
            ordersData = await ordersRes.json();
            
            renderOrdersList();

        } catch (error) {
            document.getElementById('ordersContainer').innerHTML = 
                `<div class="empty-state">Gagal memuat riwayat pesanan.</div>`;
        }
    }

    function renderOrdersList() {
        const container = document.getElementById('ordersContainer');
        
        if (!ordersData || ordersData.length === 0) {
            container.innerHTML = `<div class="empty-state">Anda belum memiliki riwayat pesanan.</div>`;
            return;
        }

        container.innerHTML = ordersData.map(order => {
            const status = getStatusData(order.status);
            // Grab the first item representing the order
            const firstItem = (order.orderItems && order.orderItems.length > 0) ? order.orderItems[0] : null;
            const itemName = firstItem ? firstItem.nama_item : 'Pesanan BarangKita';
            const itemPrice = firstItem ? firstItem.harga : order.total_pembayaran;
            const icon = guessIcon(itemName);

            return `
            <div class="order-card" onclick="openDetail(${order.id_order})">
                <div class="card-left">
                    <div class="item-icon">${icon}</div>
                    <div class="item-info">
                        <div class="item-title">${itemName}</div>
                        <div class="item-seller">by BarangKita Official</div>
                        <div class="item-price">${formatRupiah(itemPrice)}</div>
                    </div>
                </div>
                <div class="card-right">
                    <div class="status-badge ${status.cssClass}">${status.text}</div>
                    <div class="order-date">
                        ${formatIndoDate(order.tanggal_order)}
                        <span class="arrow-icon">&rsaquo;</span>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function openDetail(orderId) {
        const order = ordersData.find(o => o.id_order === orderId);
        if (!order) return;

        const status = getStatusData(order.status);
        const detailContainer = document.getElementById('detailView');
        const alamat = userProfile.alamat || 'Alamat tidak diisi';
        
        // Build items HTML
        let itemsHtml = '';
        let subtotalItems = 0;
        let totalQty = 0;

        if (order.orderItems && order.orderItems.length > 0) {
            itemsHtml = order.orderItems.map(item => {
                subtotalItems += item.subtotal;
                totalQty += item.jumlah;
                return `
                <div class="detail-product">
                    <div class="item-icon">${guessIcon(item.nama_item)}</div>
                    <div class="detail-product-info">
                        <div class="item-title">${item.nama_item}</div>
                        <div class="item-seller">by BarangKita Official</div>
                        <div class="detail-product-price-row">
                            <span class="detail-qty">${item.jumlah}x ${formatRupiah(item.harga)}</span>
                            <span class="detail-total">${formatRupiah(item.subtotal)}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        } else {
            itemsHtml = `<div class="detail-qty">Detail item tidak ditemukan.</div>`;
            subtotalItems = order.total_pembayaran; // fallback
        }

        const ongkir = getOngkosKirim();
        const totalSemua = subtotalItems + ongkir; 

        detailContainer.innerHTML = `
            <div class="detail-section">
                <div class="detail-header-flex">
                    <div class="detail-order-id"># BK-${new Date(order.tanggal_order).getFullYear()}${String(order.id_order).padStart(5, '0')}</div>
                    <div class="status-badge ${status.cssClass}">${status.text}</div>
                </div>
                <div class="detail-date">Tanggal Pesanan: ${formatIndoDate(order.tanggal_order)}</div>
            </div>

            <div class="detail-section">
                <div class="section-title">PRODUK</div>
                ${itemsHtml}
            </div>

            <div class="detail-section">
                <div class="section-title">PENGIRIMAN</div>
                <div class="shipping-row">
                    <div class="shipping-icon">📍</div>
                    <div class="shipping-text-col">
                        <span class="shipping-label">Alamat Pengiriman</span>
                        <span class="shipping-val">${alamat}</span>
                    </div>
                </div>
                <div class="shipping-row">
                    <div class="shipping-icon">🚚</div>
                    <div class="shipping-text-col">
                        <span class="shipping-label">Kurir</span>
                        <span class="shipping-val">JNE Express</span>
                    </div>
                </div>
                <div class="shipping-row">
                    <div class="shipping-icon">📦</div>
                    <div class="shipping-text-col">
                        <span class="shipping-label">Nomor Resi</span>
                        <span class="shipping-val">JNE${new Date(order.tanggal_order).getFullYear()}${String(order.id_order).padStart(6, '0')}</span>
                    </div>
                </div>
            </div>

            <div class="detail-section">
                <div class="section-title">RINCIAN HARGA</div>
                <div class="price-row">
                    <span>Subtotal (${totalQty} produk)</span>
                    <span>${formatRupiah(subtotalItems)}</span>
                </div>
                <div class="price-row">
                    <span>Ongkos Kirim</span>
                    <span>${formatRupiah(ongkir)}</span>
                </div>
                <div class="price-row total">
                    <span>Total Pembayaran</span>
                    <span>${formatRupiah(totalSemua)}</span>
                </div>
            </div>
        `;

        // Switch Views
        document.getElementById('listView').style.display = 'none';
        detailContainer.style.display = 'block';
        document.getElementById('navTitle').textContent = 'Detail Pesanan';
        
        // Change back button behavior
        document.getElementById('btnBack').onclick = goBack;
    }

    // Boot
    initPage();

</script>
</body>
</html>
