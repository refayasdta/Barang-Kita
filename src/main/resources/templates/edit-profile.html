<!DOCTYPE html>
<html lang="id">
<head>
    <script src="/js/auth-interceptor.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profil - BarangKita</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #EDE8D5;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* ══ NAVBAR ══ */
        .navbar {
            background: #ffffff;
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }

        .back-btn {
            position: absolute;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            color: #444;
            cursor: pointer;
            transition: color 0.2s;
        }

        .back-btn:hover { color: #1A5FCC; }

        .nav-title {
            font-size: 20px;
            font-weight: 800;
            color: #1A5FCC;
        }

        /* ══ CONTENT ══ */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px; /* Space between the two cards */
            padding: 40px 24px 60px;
        }

        /* ══ EDIT CARDS ══ */
        .edit-card {
            background: #ffffff;
            border-radius: 24px;
            width: 100%;
            max-width: 720px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        /* Blue gradient banner */
        .card-banner {
            width: 100%;
            height: 110px;
            background: linear-gradient(135deg, #4DD9D5 0%, #2A8FD4 50%, #1A5FCC 100%);
            position: relative;
        }

        /* Avatar wrapper */
        .avatar-wrapper {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .avatar-inner {
            width: 86px;
            height: 86px;
            background: #E8E4F0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-icon { font-size: 38px; color: #4A3F8F; }

        /* Camera button */
        .camera-btn {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 30px;
            height: 30px;
            background: #4DD9D5;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: background 0.2s;
            z-index: 2;
        }

        .camera-btn:hover { background: #38c5c1; }

        /* Hidden file input */
        #avatarInput { display: none; }

        /* Card body */
        .card-body {
            padding: 70px 40px 32px;
        }

        .card-body.no-banner {
            padding-top: 32px;
        }

        /* Form fields */
        .field-group {
            margin-bottom: 20px;
        }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .field-input {
            width: 100%;
            padding: 14px 18px;
            background: #ffffff;
            border: 1.5px solid #e0dbd0;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.2s;
        }

        .field-input:focus { border-color: #4DD9D5; }
        .field-input::placeholder { color: #bbb; }

        textarea.field-input {
            resize: none;
            height: 110px;
            line-height: 1.6;
        }

        /* Error */
        .error-msg {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            min-height: 18px;
        }

        /* Buttons */
        .action-buttons {
            display: flex;
            gap: 14px;
            margin-top: 8px;
        }

        .btn-batal {
            flex: 1;
            padding: 15px;
            background: #D0CBC0;
            color: #555;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-batal:hover { background: #c0bab0; }

        .btn-simpan {
            flex: 1;
            padding: 15px;
            background: #4DD9D5;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-simpan:hover { background: #38c5c1; }
        .btn-simpan:disabled { background: #aaa; cursor: not-allowed; }

        /* Toast */
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px); background:#1a1a1a; color:white; padding:12px 28px; border-radius:50px; font-size:14px; font-weight:600; z-index:999; opacity:0; transition:all 0.3s ease; pointer-events:none; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<nav class="navbar">
    <button class="back-btn" onclick="window.location.href='/profile'">← Kembali</button>
    <span class="nav-title">Edit Profil</span>
</nav>

<div class="content">
    
    <div class="edit-card">
        <div class="card-banner">
            <div class="avatar-wrapper">
                <div class="avatar-inner" id="avatarPreview">
                    <span class="avatar-icon">👤</span>
                </div>
                <button class="camera-btn" onclick="document.getElementById('avatarInput').click()" title="Ubah foto">📷</button>
            </div>
        </div>

        <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(event)">

        <div class="card-body">
            <div class="field-group" id="group-nama">
                <label class="field-label" id="label-nama">Nama Lengkap</label>
                <input type="text" class="field-input" id="field-nama" placeholder="Masukkan data" />
            </div>

            <div class="field-group" id="group-telepon">
                <label class="field-label">Nomor Telepon</label>
                <input type="tel" class="field-input" id="field-telepon" placeholder="+62 xxx-xxxx-xxxx" />
            </div>

            <div class="field-group" id="group-alamat">
                <label class="field-label">Alamat</label>
                <textarea class="field-input" id="field-alamat" placeholder="Masukkan alamat lengkap..."></textarea>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <div class="action-buttons">
                <button class="btn-batal" onclick="window.location.href='/profile'">Batal</button>
                <button class="btn-simpan" id="saveBtn" onclick="saveProfile()">
                    💾 Simpan Profil
                </button>
            </div>
        </div>
    </div>

    <div class="edit-card">
        <div class="card-body no-banner">
            <h3 style="font-size: 18px; font-weight: 800; color: #1a1a1a; margin-bottom: 24px;">🔒 Ubah Password</h3>

            <div class="field-group">
                <label class="field-label">Password Lama</label>
                <input type="password" class="field-input" id="oldPassword" placeholder="Masukkan password saat ini" />
            </div>

            <div class="field-group">
                <label class="field-label">Password Baru</label>
                <input type="password" class="field-input" id="newPassword" placeholder="Masukkan password baru" />
            </div>

            <div class="field-group">
                <label class="field-label">Konfirmasi Password Baru</label>
                <input type="password" class="field-input" id="confirmPassword" placeholder="Ulangi password baru" />
            </div>

            <div class="action-buttons" style="margin-top: 24px;">
                <button class="btn-simpan" id="btnChangePassword" onclick="changePassword()" style="width: 100%;">
                    🔑 Simpan Password Baru
                </button>
            </div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    function showToast(msg, duration = 2500) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), duration);
    }

    function getUserFromToken(tok) {
        try { return JSON.parse(atob(tok.split('.')[1])); } catch { return {}; }
    }

    // ── Avatar preview ──
    function previewAvatar(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('avatarPreview').innerHTML =
                `<img src="${e.target.result}" alt="Avatar">`;
        };
        reader.readAsDataURL(file);
    }

    const role = localStorage.getItem('role'); // Get the role!

    // ── Load existing profile data ──
    async function loadProfile() {
        const userPayload = getUserFromToken(token);
        const userId = userPayload.id_akun || null;
        if (!userId) return;

        // UI Shape-Shifting for Admins
        if (role === 'Admin') {
            document.querySelector('.card-banner').style.display = 'none'; // Hide blue banner
            document.querySelector('.card-body').classList.add('no-banner');
            document.getElementById('label-nama').textContent = 'Username';
            document.getElementById('group-telepon').style.display = 'none'; // Hide Phone
            document.getElementById('group-alamat').style.display = 'none';  // Hide Address
        }

        try {
            const res = await fetch(`/api/users/${userId}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                const data = await res.json();
                
                if (role === 'Admin') {
                    document.getElementById('field-nama').value = data.username || '';
                } else {
                    document.getElementById('field-nama').value    = data.nama || '';
                    document.getElementById('field-telepon').value = data.no_telepon || '';
                    document.getElementById('field-alamat').value  = data.alamat || '';

                    if (data.foto_profile) {
                        document.getElementById('avatarPreview').innerHTML =
                            `<img src="/images/${data.foto_profile}" alt="Avatar"
                                  onerror="this.parentElement.innerHTML='<span class=\'avatar-icon\'>👤</span>'">`;
                    }
                }
            }
        } catch(e) {}
    }

    // ── Save profile ──
    async function saveProfile() {
        const fieldNama = document.getElementById('field-nama').value.trim();
        const errorEl   = document.getElementById('errorMsg');
        const saveBtn   = document.getElementById('saveBtn');

        if (!fieldNama) { 
            errorEl.textContent = role === 'Admin' ? 'Username wajib diisi!' : 'Nama lengkap wajib diisi!'; 
            return; 
        }

        errorEl.textContent = '';
        saveBtn.disabled = true;
        saveBtn.textContent = 'Menyimpan...';

        const userPayload = getUserFromToken(token);
        const userId = userPayload.id_akun || null;

        const formData = new FormData();
        
        // Pack data based on Role
        if (role === 'Admin') {
            formData.append('username', fieldNama);
        } else {
            const telepon  = document.getElementById('field-telepon').value.trim();
            const alamat   = document.getElementById('field-alamat').value.trim();
            const fileInput = document.getElementById('avatarInput');

            formData.append('nama', fieldNama);
            formData.append('no_telepon', telepon);
            formData.append('alamat', alamat);
            if (fileInput.files.length > 0) {
                formData.append('file', fileInput.files[0]);
            }
        }

        try {
            const res = await fetch(`/api/users/${userId}`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token },
                body: formData
            });

            if (res.ok) {
                showToast('✅ Profil berhasil disimpan!');
                setTimeout(() => window.location.href = '/profile', 1500);
            } else {
                errorEl.textContent = 'Gagal menyimpan profil.';
                saveBtn.disabled = false;
                saveBtn.innerHTML = '💾 Simpan Profil';
            }
        } catch(err) {
            errorEl.textContent = 'Koneksi gagal. Coba lagi.';
            saveBtn.disabled = false;
            saveBtn.innerHTML = '💾 Simpan Profil';
        }
    }

    // ── Change Password ──
    async function changePassword() {
        const oldPassword = document.getElementById('oldPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('btnChangePassword');

        if (!oldPassword || !newPassword || !confirmPassword) {
            showToast('❌ Harap isi semua kolom password!');
            return;
        }

        if (newPassword !== confirmPassword) {
            showToast('❌ Password baru dan konfirmasi tidak cocok!');
            return;
        }

        const userPayload = getUserFromToken(token);
        const userId = userPayload.id_akun || null;
        if (!userId) {
            alert("Sesi tidak valid, silakan login ulang.");
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Menyimpan...';

        try {
            const res = await fetch(`/api/users/${userId}/password`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    oldPassword: oldPassword,
                    newPassword: newPassword
                })
            });

            const data = await res.json();

            if (res.ok) {
                showToast('✅ Password berhasil diubah!');
                document.getElementById('oldPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            } else {
                showToast('❌ ' + (data.error || 'Gagal mengubah password.'));
            }
        } catch(err) {
            showToast('❌ Koneksi gagal jaringan.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '🔑 Simpan Password Baru';
        }
    }

    // ── Init ──
    loadProfile();
</script>
</body>
</html>
