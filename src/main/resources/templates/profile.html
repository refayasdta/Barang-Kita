<!DOCTYPE html>
<html lang="id">
<head>
    <script src="/js/auth-interceptor.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - BarangKita</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #EDE8D5;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* ══════════════════════════════
           UNIVERSAL NAVBAR CSS
        ══════════════════════════════ */
        .navbar { background: #ffffff; padding: 0 40px; height: 64px; width: 100%; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .nav-logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
        .nav-logo img { height: 38px; object-fit: contain; filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.35)); }
        .nav-logo-fallback { display: flex; align-items: center; gap: 4px; }
        .nav-logo-fallback .logo-icon { color: #F5A623; font-size: 22px; }
        .nav-logo-fallback .logo-name { font-size: 22px; font-weight: 800; color: #1A5FCC; }
        .nav-search { flex: 1; max-width: 580px; margin: 0 40px; position: relative; }
        .nav-search input { width: 100%; padding: 10px 44px 10px 20px; border: 1.5px solid #e0dbd0; border-radius: 50px; font-size: 14px; font-family: 'Poppins', sans-serif; background: #fff; color: #333; outline: none; transition: border-color 0.2s; }
        .nav-search input:focus { border-color: #1A5FCC; }
        .nav-search input::placeholder { color: #aaa; }
        .nav-search .search-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #888; font-size: 16px; cursor: pointer; }
        .nav-icons { display: flex; align-items: center; gap: 20px; }
        .nav-icon-btn { background: none; border: none; cursor: pointer; position: relative; color: #444; font-size: 22px; display: flex; align-items: center; transition: color 0.2s; }
        .nav-icon-btn:hover { color: #1A5FCC; }
        .cart-badge { position: absolute; top: -6px; right: -8px; background: #F5A623; color: white; font-size: 10px; font-weight: 800; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn-admin-panel { display: none; align-items: center; gap: 6px; padding: 8px 18px; background: #1A5FCC; color: white; border: none; border-radius: 50px; font-size: 13px; font-weight: 700; font-family: 'Poppins', sans-serif; cursor: pointer; transition: background 0.2s; }
        .btn-admin-panel:hover { background: #154fa8; }
        @media (max-width: 768px) { .navbar { padding: 0 20px; } .nav-search { margin: 0 16px; } }

        /* ══════════════════════════════
           CONTENT
        ══════════════════════════════ */
        .content {
            display: flex;
            justify-content: center;
            padding: 40px 24px 60px;
        }

        /* ══ PROFILE CARD ══ */
        .profile-card {
            background: #ffffff;
            border-radius: 24px;
            width: 100%;
            max-width: 720px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        /* Blue gradient banner */
        .card-banner {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #4DD9D5 0%, #2A8FD4 50%, #1A5FCC 100%);
            position: relative;
        }

        /* Avatar wrapper */
        .avatar-wrapper {
            position: absolute;
            bottom: -55px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 110px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .avatar-inner {
            width: 94px;
            height: 94px;
            background: #E8E4F0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-icon { font-size: 42px; color: #4A3F8F; }

        /* Card body */
        .card-body { padding: 70px 40px 32px; }

        .user-name {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 28px;
        }

        /* Info rows */
        .info-row {
            background: #F0E8D0;
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }

        .info-icon {
            width: 42px;
            height: 42px;
            background: #EEF4FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }

        .info-text { flex: 1; }
        .info-label { font-size: 11px; color: #888; font-weight: 600; margin-bottom: 3px; }
        .info-value { font-size: 14px; font-weight: 600; color: #1a1a1a; }

        /* Buttons */
        .btn-riwayat {
            width: 100%;
            padding: 16px;
            background: #F0E8D0;
            color: #1A5FCC;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            transition: background 0.2s;
        }

        .btn-riwayat:hover { background: #e8dcc4; }

        .btn-edit {
            width: 100%;
            padding: 16px;
            background: #4DD9D5;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-edit:hover { background: #38c5c1; }

        /* Logout Button */
        .btn-logout {
            width: 100%;
            padding: 16px;
            background: #FDEDEC;
            color: #e74c3c;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            transition: background 0.2s;
        }

        .btn-logout:hover { background: #fadbd8; }

        /* Loading */
        .loading-state { text-align: center; padding: 60px; color: #aaa; }
        .spinner { width: 36px; height: 36px; border: 3px solid #e0dbd0; border-top-color: #1A5FCC; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a1a; color: white; padding: 12px 28px; border-radius: 50px; font-size: 14px; font-weight: 600; z-index: 999; opacity: 0; transition: all 0.3s ease; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/home" class="nav-logo" id="navLogo">
        <img src="/assets/logo-barangkita-final.png" alt="BarangKita"
             onerror="this.parentElement.innerHTML='<div class=\'nav-logo-fallback\'><span class=\'logo-icon\'>🚶</span><span class=\'logo-name\'>barangkita</span></div>'">
    </a>

    <div class="nav-search">
        <input type="text" id="searchInput" placeholder="Cari produk..."
               onkeydown="if(event.key==='Enter') window.location.href='/home?search='+this.value"/>
        <span class="search-icon"
              onclick="window.location.href='/home?search='+document.getElementById('searchInput').value">🔍</span>
    </div>

    <div class="nav-icons">
        <button class="nav-icon-btn" onclick="window.location.href='/profile'" title="Profile">👤</button>
        <button class="btn-admin-panel" id="adminPanelBtn" onclick="window.location.href='/admin-dashboard'">
            ⚙ Admin Panel
        </button>
        <button class="nav-icon-btn" onclick="window.location.href='/cart'" title="Keranjang">
            🛒
            <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
        </button>
    </div>
</nav>

<div class="content">
    <div class="profile-card" id="profileCard">
        <div class="loading-state">
            <div class="spinner"></div>
            <div>Memuat profil...</div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    function showToast(msg, duration = 2500) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), duration);
    }

    function getUserFromToken(tok) {
        try { return JSON.parse(atob(tok.split('.')[1])); } catch { return {}; }
    }

    // ── Render Profile UI ──
    function renderProfile(user) {
        const card = document.getElementById('profileCard');
        card.innerHTML = `
            <div class="card-banner">
                <div class="avatar-wrapper">
                    <div class="avatar-inner">
                        ${user.foto_profile
                            ? `<img src="/images/${user.foto_profile}" alt="Avatar"
                                    onerror="this.parentElement.innerHTML='<span class=\'avatar-icon\'>👤</span>'">`
                            : `<span class="avatar-icon">👤</span>`
                        }
                    </div>
                </div>
            </div>

            <div class="card-body">
                <div class="user-name">${user.nama || user.email || 'Pengguna'}</div>

                <div class="info-row">
                    <div class="info-icon">📞</div>
                    <div class="info-text">
                        <div class="info-label">Nomor Telepon</div>
                        <div class="info-value">${user.no_telepon || 'Belum diatur'}</div>
                    </div>
                </div>

                <div class="info-row">
                    <div class="info-icon">📍</div>
                    <div class="info-text">
                        <div class="info-label">Alamat</div>
                        <div class="info-value">${user.alamat || 'Belum diatur'}</div>
                    </div>
                </div>

                <button class="btn-riwayat" onclick="window.location.href='/order-history'">
                    📋 Riwayat Pesanan
                </button>

                <button class="btn-edit" onclick="window.location.href='/edit-profile'">
                    ✏️ Edit Profil
                </button>

                <button class="btn-logout" onclick="logout()">
                    🚪 Logout
                </button>
            </div>
        `;
    }

    // ── Fetch User Data ──
    async function loadProfile() {
        const userPayload = getUserFromToken(token);
        const userId = userPayload.id_akun || null;

        if (!userId) {
            showToast('❌ Sesi tidak valid, silakan login ulang.');
            setTimeout(() => window.location.href = '/login', 2000);
            return;
        }

        try {
            const res = await fetch(`/api/users/${userId}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (res.ok) {
                const user = await res.json();
                renderProfile(user);
            } else {
                renderProfile({ email: userPayload.sub || 'Pengguna' });
            }
        } catch (err) {
            renderProfile({ email: getUserFromToken(token).sub || 'Pengguna' });
        }
    }

    // ── Logout Function ──
    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('role');
        localStorage.removeItem('checkoutIds');
        
        showToast('👋 Berhasil keluar!');
        setTimeout(() => {
            window.location.href = '/login';
        }, 1000);
    }

    loadProfile();
</script>
</body>
</html>
