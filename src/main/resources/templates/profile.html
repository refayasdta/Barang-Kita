<!DOCTYPE html>
<html lang="id">
<head>
    <script src="/js/auth-interceptor.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - BarangKita</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #EDE8D5;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* ══ NAVBAR ══ */
        .navbar {
            background: #ffffff;
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }

        .back-btn {
            position: absolute;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            color: #444;
            cursor: pointer;
            transition: color 0.2s;
        }

        .back-btn:hover { color: #1A5FCC; }

        .nav-title {
            font-size: 20px;
            font-weight: 800;
            color: #1A5FCC;
        }

        /* ══ CONTENT ══ */
        .content {
            display: flex;
            justify-content: center;
            padding: 40px 24px 60px;
        }

        /* ══ PROFILE CARD ══ */
        .profile-card {
            background: #ffffff;
            border-radius: 24px;
            width: 100%;
            max-width: 720px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        /* Blue gradient banner */
        .card-banner {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #4DD9D5 0%, #2A8FD4 50%, #1A5FCC 100%);
            position: relative;
        }

        /* Avatar wrapper — centered, overlapping banner */
        .avatar-wrapper {
            position: absolute;
            bottom: -55px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 110px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .avatar-inner {
            width: 94px;
            height: 94px;
            background: #E8E4F0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-icon {
            font-size: 42px;
            color: #4A3F8F;
        }

        /* Card body */
        .card-body {
            padding: 70px 40px 32px;
        }

        .user-name {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 28px;
        }

        /* Info rows */
        .info-row {
            background: #F0E8D0;
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }

        .info-icon {
            width: 42px;
            height: 42px;
            background: #EEF4FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }

        .info-text { flex: 1; }

        .info-label {
            font-size: 11px;
            color: #888;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
        }

        /* Buttons */
        .btn-riwayat {
            width: 100%;
            padding: 16px;
            background: #F0E8D0;
            color: #1A5FCC;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            transition: background 0.2s;
        }

        .btn-riwayat:hover { background: #e8dcc4; }

        .btn-edit {
            width: 100%;
            padding: 16px;
            background: #4DD9D5;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-edit:hover { background: #38c5c1; }

        /* Loading */
        .loading-state {
            text-align: center;
            padding: 60px;
            color: #aaa;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e0dbd0;
            border-top-color: #1A5FCC;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1a1a;
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <button class="back-btn" onclick="goBack()">← Kembali</button>
    <span class="nav-title">Profil Saya</span>
</nav>

<!-- CONTENT -->
<div class="content">
    <div class="profile-card" id="profileCard">
        <div class="loading-state">
            <div class="spinner"></div>
            <div>Memuat profil...</div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const token = localStorage.getItem('token');
    const role  = localStorage.getItem('role');

    if (!token) window.location.href = '/login';

    function showToast(msg, duration = 2500) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), duration);
    }

    function goBack() {
        if (document.referrer) window.history.back();
        else window.location.href = '/home';
    }

    function getUserFromToken(tok) {
        try { return JSON.parse(atob(tok.split('.')[1])); } catch { return {}; }
    }

    function renderProfile(user) {
        const card = document.getElementById('profileCard');
        card.innerHTML = `
            <!-- Blue Banner -->
            <div class="card-banner">
                <div class="avatar-wrapper">
                    <div class="avatar-inner">
                        ${user.foto_profile
                            ? `<img src="/images/${user.foto_profile}" alt="Avatar"
                                    onerror="this.parentElement.innerHTML='<span class=\'avatar-icon\'>👤</span>'">`
                            : `<span class="avatar-icon">👤</span>`
                        }
                    </div>
                </div>
            </div>

            <!-- Card Body -->
            <div class="card-body">
                <div class="user-name">${user.nama || user.email || 'Pengguna'}</div>

                <!-- Phone -->
                <div class="info-row">
                    <div class="info-icon">📞</div>
                    <div class="info-text">
                        <div class="info-label">Nomor Telepon</div>
                        <div class="info-value">${user.no_telepon || 'Belum diatur'}</div>
                    </div>
                </div>

                <!-- Address -->
                <div class="info-row">
                    <div class="info-icon">📍</div>
                    <div class="info-text">
                        <div class="info-label">Alamat</div>
                        <div class="info-value">${user.alamat || 'Belum diatur'}</div>
                    </div>
                </div>

                <!-- Riwayat Pesanan -->
                <button class="btn-riwayat" onclick="window.location.href='/order-history'">
                    📋 Riwayat Pesanan
                </button>

                <!-- Edit Profil -->
                <button class="btn-edit" onclick="window.location.href='/edit-profile'">
                    ✏️ Edit Profil
                </button>
            </div>
        `;
    }

    async function loadProfile() {
        const userPayload = getUserFromToken(token);
        const userId = userPayload.id_akun || null;

        if (!userId) {
            showToast('❌ Sesi tidak valid, silakan login ulang.');
            setTimeout(() => window.location.href = '/login', 2000);
            return;
        }

        try {
            const res = await fetch(`/api/users/${userId}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (res.ok) {
                const user = await res.json();
                renderProfile(user);
            } else {
                // Fallback: show email from token
                renderProfile({ email: userPayload.sub || 'Pengguna' });
            }
        } catch (err) {
            renderProfile({ email: getUserFromToken(token).sub || 'Pengguna' });
        }
    }

    loadProfile();
</script>
</body>
</html>
